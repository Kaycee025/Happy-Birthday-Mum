<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password • Mum's Keepsake Studio</title>
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #251221 0%, #150A14 60%, #0B040A 100%);
      padding: 24px 16px;
      box-sizing: border-box;
    }
    .auth-card {
      background: rgba(30, 14, 28, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.45);
      text-align: center;
      box-sizing: border-box;
    }
    .auth-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: inline-block;
    }
    .auth-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.3rem;
      font-weight: 600;
      color: #FFF7ED;
      margin: 0 0 6px 0;
    }
    .auth-subtitle {
      font-size: 0.95rem;
      color: #D1BFCC;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    .security-notice {
      background: rgba(45, 18, 40, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: #D1BFCC;
      margin-bottom: 24px;
      text-align: left;
      line-height: 1.45;
    }
    .security-notice strong {
      color: #F5D78B;
    }
    .auth-form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .auth-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #F5D78B;
      margin-bottom: 6px;
    }
    .auth-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: rgba(20, 9, 19, 0.85);
      font-size: 16px; /* iOS auto-zoom prevention */
      color: #FFF7ED;
      font-family: inherit;
      transition: all 0.25s ease;
      box-sizing: border-box;
    }
    .auth-input:focus {
      outline: none;
      border-color: #F5D78B;
      background: rgba(30, 13, 28, 0.95);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
    }
    .auth-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 50px;
      background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
      color: #120912;
      font-weight: 800;
      font-size: 1.05rem;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35);
    }
    .auth-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
    }
    .auth-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .alert-banner {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      margin-bottom: 20px;
      line-height: 1.45;
      text-align: left;
    }
    .alert-success {
      background: rgba(20, 60, 30, 0.7);
      color: #7EE787;
      border: 1px solid rgba(126, 231, 135, 0.4);
    }
    .alert-error {
      background: rgba(80, 20, 20, 0.7);
      color: #FF7B72;
      border: 1px solid rgba(255, 123, 114, 0.4);
    }
    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(212, 175, 55, 0.25);
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: #F5D78B;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      color: #FFF7ED;
      text-decoration: underline;
    }
    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 18px;
        border-radius: 20px;
      }
      .auth-title {
        font-size: 1.9rem;
      }
      .auth-subtitle {
        font-size: 0.88rem;
        margin-bottom: 18px;
      }
    }
  </style>
</head>
<body class="admin-body">

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-icon">💌</div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Request a single-use secure reset link for your administrator account.</p>

      <div class="security-notice">
        🔒 <strong>Fixed Recovery Protection:</strong> Password reset links are strictly delivered to the administrator's fixed email address on file: <strong>Kcee492@gmail.com</strong>.
      </div>

      <div id="alert-banner" class="alert-banner" style="display:none;"></div>

      <form id="forgot-form">
        <div class="auth-form-group">
          <label class="auth-label" for="username">Registered Email Address</label>
          <input type="email" id="username" class="auth-input" placeholder="Kcee492@gmail.com" autocomplete="email" required autofocus>
        </div>

        <button type="submit" id="submit-btn" class="auth-btn">
          <span>Send Recovery Link 💌</span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="/admin/login">&larr; Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgot-form');
    const submitBtn = document.getElementById('submit-btn');
    const alertBanner = document.getElementById('alert-banner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      const email = document.getElementById('username').value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Processing request... 🌸</span>';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        alertBanner.className = 'alert-banner alert-success';
        let successHtml = `
          <strong>Reset Link Dispatched:</strong> A secure password reset link has been generated and dispatched to <strong>Kcee492@gmail.com</strong>.<br><br>
          <span style="font-size:0.85rem;color:#495057;">Please check your inbox (and spam/promotions folder). Links expire in 20 minutes and are single-use.</span>
        `;

        if (data.resetUrl) {
          successHtml += `
            <div style="margin-top: 16px; padding-top: 14px; border-top: 1px dashed rgba(25, 135, 84, 0.4); text-align: center;">
              <a href="${data.resetUrl}" class="auth-btn" style="text-decoration:none; display:inline-block; padding:10px 18px; font-size:0.92rem;">
                Open Password Reset Page &rarr;
              </a>
            </div>
          `;
        }

        alertBanner.innerHTML = successHtml;
        alertBanner.style.display = 'block';
        form.style.display = 'none';
      } catch (err) {
        alertBanner.className = 'alert-banner alert-error';
        alertBanner.textContent = 'Network error. Please try again later.';
        alertBanner.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Send Recovery Link 💌</span>';
      }
    });
  </script>
</body>
</html>
