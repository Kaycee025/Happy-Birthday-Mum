<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password • Mum's Keepsake Studio</title>
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #251221 0%, #150A14 60%, #0B040A 100%);
      padding: 24px 16px;
      box-sizing: border-box;
    }
    .auth-card {
      background: rgba(30, 14, 28, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.45);
      text-align: center;
      box-sizing: border-box;
    }
    .auth-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: inline-block;
    }
    .auth-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.3rem;
      font-weight: 600;
      color: #FFF7ED;
      margin: 0 0 6px 0;
    }
    .auth-subtitle {
      font-size: 0.95rem;
      color: #D1BFCC;
      margin: 0 0 24px 0;
      line-height: 1.4;
    }
    .auth-form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .auth-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #F5D78B;
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
    }
    .auth-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: rgba(20, 9, 19, 0.85);
      font-size: 16px; /* iOS auto-zoom prevention */
      color: #FFF7ED;
      font-family: inherit;
      transition: all 0.25s ease;
      box-sizing: border-box;
    }
    .auth-input:focus {
      outline: none;
      border-color: #F5D78B;
      background: rgba(30, 13, 28, 0.95);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
    }
    .toggle-pw-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #D1BFCC;
      font-size: 1.1rem;
      padding: 4px;
    }
    /* Password Strength Indicator */
    .strength-meter-wrap {
      margin-top: 8px;
      text-align: left;
    }
    .strength-bar {
      height: 6px;
      background: rgba(45, 18, 40, 0.85);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      transition: all 0.3s ease;
      background: #dc3545;
    }
    .strength-label {
      font-size: 0.78rem;
      color: #D1BFCC;
      display: flex;
      justify-content: space-between;
    }
    .auth-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 50px;
      background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
      color: #120912;
      font-weight: 800;
      font-size: 1.05rem;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35);
      margin-top: 10px;
    }
    .auth-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
    }
    .auth-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
      text-align: left;
    }
    .alert-error {
      background: rgba(80, 20, 20, 0.7);
      color: #FF7B72;
      border: 1px solid rgba(255, 123, 114, 0.4);
    }
    .alert-success {
      background: rgba(20, 60, 30, 0.7);
      color: #7EE787;
      border: 1px solid rgba(126, 231, 135, 0.4);
    }
    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(212, 175, 55, 0.25);
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: #F5D78B;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      color: #FFF7ED;
      text-decoration: underline;
    }
    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 18px;
        border-radius: 20px;
      }
      .auth-title {
        font-size: 1.9rem;
      }
      .auth-subtitle {
        font-size: 0.88rem;
        margin-bottom: 18px;
      }
    }
  </style>
</head>
<body class="admin-body">

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-icon">🔑</div>
      <h1 class="auth-title">Create New Password</h1>
      <p class="auth-subtitle">Please choose a strong password (minimum 10 characters).</p>

      <div id="alert-banner" class="alert-banner"></div>

      <div id="invalid-token-view" style="display:none;">
        <p style="color:#B02A37;font-size:0.95rem;line-height:1.5;">This password reset link is invalid or has expired (links expire after 20 minutes and can only be used once).</p>
        <a href="/admin/forgot-password" class="auth-btn" style="text-decoration:none;display:inline-block;box-sizing:border-box;">Request New Link</a>
      </div>

      <form id="reset-form">
        <div class="auth-form-group">
          <label class="auth-label" for="new-password">New Password</label>
          <div class="input-wrap">
            <input type="password" id="new-password" class="auth-input" placeholder="At least 10 characters" minlength="10" required autofocus>
            <button type="button" class="toggle-pw-btn" onclick="toggleVis('new-password', this)">👁️</button>
          </div>
          <div class="strength-meter-wrap">
            <div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
            <div class="strength-label">
              <span id="strength-text">Too short</span>
              <span>Min 10 characters</span>
            </div>
          </div>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="confirm-password">Confirm New Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm-password" class="auth-input" placeholder="Repeat new password" required>
            <button type="button" class="toggle-pw-btn" onclick="toggleVis('confirm-password', this)">👁️</button>
          </div>
        </div>

        <button type="submit" id="reset-btn" class="auth-btn">
          <span>Update Password & Log In ✨</span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="/admin/login">&larr; Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const resetForm = document.getElementById('reset-form');
    const invalidView = document.getElementById('invalid-token-view');
    const alertBanner = document.getElementById('alert-banner');
    const newPw = document.getElementById('new-password');
    const confirmPw = document.getElementById('confirm-password');
    const strengthFill = document.getElementById('strength-fill');
    const strengthText = document.getElementById('strength-text');
    const resetBtn = document.getElementById('reset-btn');

    if (!token) {
      resetForm.style.display = 'none';
      invalidView.style.display = 'block';
    }

    function toggleVis(id, btn) {
      const el = document.getElementById(id);
      const isPw = el.type === 'password';
      el.type = isPw ? 'text' : 'password';
      btn.textContent = isPw ? '🔒' : '👁️';
    }

    // Password strength indicator
    newPw.addEventListener('input', () => {
      const val = newPw.value;
      let score = 0;
      if (val.length >= 10) score++;
      if (val.length >= 14) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      if (val.length < 10) {
        strengthFill.style.width = '20%';
        strengthFill.style.background = '#dc3545';
        strengthText.textContent = 'Too short (min 10 chars)';
      } else if (score <= 2) {
        strengthFill.style.width = '45%';
        strengthFill.style.background = '#ffc107';
        strengthText.textContent = 'Moderate';
      } else if (score <= 4) {
        strengthFill.style.width = '75%';
        strengthFill.style.background = '#17a2b8';
        strengthText.textContent = 'Strong';
      } else {
        strengthFill.style.width = '100%';
        strengthFill.style.background = '#28a745';
        strengthText.textContent = 'Very Strong';
      }
    });

    function showAlert(msg, type = 'error') {
      alertBanner.textContent = msg;
      alertBanner.className = 'alert-banner ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertBanner.style.display = 'block';
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      const p1 = newPw.value;
      const p2 = confirmPw.value;

      if (p1.length < 10) {
        showAlert('Password must be at least 10 characters long.');
        return;
      }

      if (p1 !== p2) {
        showAlert('Passwords do not match. Please re-enter.');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.innerHTML = '<span>Saving new password... 🌸</span>';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: p1, confirmPassword: p2 })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showAlert('Password changed successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/admin/login?reset=success';
          }, 1500);
        } else {
          showAlert(data.error || 'Failed to reset password.');
          if (data.invalidToken) {
            resetForm.style.display = 'none';
            invalidView.style.display = 'block';
          }
          resetBtn.disabled = false;
          resetBtn.innerHTML = '<span>Update Password & Log In ✨</span>';
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<span>Update Password & Log In ✨</span>';
      }
    });
  </script>
</body>
</html>
